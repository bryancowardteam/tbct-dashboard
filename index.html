<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBCT Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D2C4C;
      --bg-deep: #0A2240;
      --bg-darker: #071A33;
      --accent: #1A5FA8;
      --grey: #7AA4C8;
      --white: #FFFFFF;
      --card-bg: #0A2240;
      --border: rgba(255,255,255,0.12);
    }
    body { background: var(--bg); color: var(--white); font-family: 'Poppins', sans-serif; font-weight: 300; min-height: 100vh; }

    /* HEADER */
    header { background: var(--bg-darker); border-bottom: 1px solid var(--border); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; }
    .logo-img { height: 72px; width: auto; display: block; }
    .header-right { text-align: right; }
    .header-title { font-size: 18px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
    .last-updated { font-size: 11px; color: var(--grey); margin-top: 5px; }

    /* TABS */
    nav { background: var(--bg-darker); border-bottom: 1px solid var(--border); padding: 0 40px; display: flex; }
    .tab-btn { background: none; border: none; color: var(--grey); font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; padding: 16px 22px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; position: relative; top: 1px; }
    .tab-btn:hover { color: var(--white); }
    .tab-btn.active { color: var(--white); border-bottom-color: var(--white); }
    .tab-count { background: var(--accent); color: var(--white); font-size: 10px; padding: 2px 7px; border-radius: 10px; margin-left: 6px; }

    /* MAIN */
    main { padding: 32px 40px; max-width: 1440px; margin: 0 auto; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* STATS */
    .stats-bar { display: flex; gap: 0; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .stat { padding: 0 28px 0 0; margin-right: 28px; border-right: 1px solid var(--border); }
    .stat:first-child { padding-left: 0; }
    .stat:last-child { border-right: none; }
    .stat-value { font-size: 26px; font-weight: 600; line-height: 1; }
    .stat-label { font-size: 10px; color: var(--grey); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }

    /* FILTERS */
    .filter-bar { display: flex; gap: 6px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
    .filter-label { font-size: 10px; color: var(--grey); letter-spacing: 0.1em; text-transform: uppercase; margin-right: 4px; }
    .filter-btn { background: none; border: 1px solid var(--border); color: var(--grey); font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 0.05em; text-transform: uppercase; padding: 5px 12px; border-radius: 2px; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover { border-color: rgba(255,255,255,0.35); color: var(--white); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--white); }

    /* CARDS GRID */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }

    /* CARD */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 2px; padding: 20px; cursor: pointer; transition: all 0.2s; position: relative; }
    .card:hover { border-color: rgba(255,255,255,0.25); background: var(--bg-deep); }
    .card.hidden { display: none; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-address { font-size: 14px; font-weight: 500; line-height: 1.3; flex: 1; padding-right: 10px; }
    .card-city { font-size: 11px; color: var(--grey); margin-top: 2px; font-weight: 300; }
    .card-badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }
    .badge { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; white-space: nowrap; }
    .badge-listing { background: var(--accent); color: #fff; }
    .badge-buyer { background: #112211; color: #81c784; border: 1px solid #1e3d1e; }
    .badge-active { background: rgba(26,95,168,0.45); color: #90caf9; border: 1px solid #1A5FA8; }
    .badge-pending { background: #2a1e00; color: #ffd54f; border: 1px solid #4d3800; }
    .badge-cancelled { background: #2a0000; color: #ef9a9a; border: 1px solid #4d0000; }
    .badge-closed { background: rgba(255,255,255,0.08); color: #9eb6cc; border: 1px solid rgba(255,255,255,0.15); }
    .badge-new-construction { background: #1a0a3d; color: #ce93d8; border: 1px solid #3d1a5a; }
    .badge-office-exclusive { background: #2a1800; color: #ffcc80; border: 1px solid #5a3200; }
    .card-price { font-size: 20px; font-weight: 600; margin: 10px 0 6px; }
    .card-meta { font-size: 12px; color: var(--grey); line-height: 1.7; }
    .expand-area { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; display: none; }
    .card.expanded .expand-area { display: block; }
    .expand-row { display: flex; gap: 8px; margin-bottom: 5px; font-size: 12px; }
    .expand-lbl { color: var(--grey); min-width: 90px; flex-shrink: 0; font-weight: 300; }
    .expand-val { color: var(--white); }
    .expand-link { display: inline-block; margin-top: 8px; font-size: 11px; color: #64b5f6; text-decoration: none; letter-spacing: 0.04em; }
    .expand-link:hover { color: #90caf9; }
    .chevron { position: absolute; bottom: 12px; right: 16px; font-size: 14px; color: var(--grey); transition: transform 0.2s; }
    .card.expanded .chevron { transform: rotate(180deg); }

    /* EVENTS */
    .events-list { display: flex; flex-direction: column; gap: 10px; }
    .ev-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 2px; padding: 18px 22px; display: flex; align-items: flex-start; gap: 20px; transition: all 0.2s; }
    .ev-card:hover { border-color: rgba(255,255,255,0.25); background: var(--bg-deep); }
    .ev-card.hidden { display: none; }
    .ev-date { text-align: center; min-width: 50px; background: var(--accent); padding: 8px 10px; border-radius: 2px; }
    .ev-month { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.75); }
    .ev-day { font-size: 22px; font-weight: 700; line-height: 1.1; }
    .ev-info { flex: 1; }
    .ev-title { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
    .ev-time { font-size: 12px; color: var(--grey); margin-bottom: 3px; }
    .ev-loc { font-size: 12px; color: var(--grey); }

    /* MARKETING */
    .mk-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 2px; padding: 20px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
    .mk-card:hover { border-color: rgba(255,255,255,0.25); background: var(--bg-deep); }
    .mk-card.hidden { display: none; }
    .mk-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 12px; }
    .mk-title { font-size: 14px; font-weight: 500; }
    .mk-meta { font-size: 12px; color: var(--grey); }
    .badge-complete { background: #0d2c0d; color: #81c784; border: 1px solid #1e5c1e; }
    .badge-in-progress { background: rgba(26,95,168,0.3); color: #64b5f6; border: 1px solid #1A5FA8; }
    .badge-review { background: #2c1e0d; color: #ffcc80; border: 1px solid #5c3a1a; }
    .mk-notes { font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.7; display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .mk-card.expanded .mk-notes { display: block; }

    /* EMPTY */
    .empty { text-align: center; padding: 60px 20px; color: var(--grey); font-size: 13px; letter-spacing: 0.05em; }

    @media (max-width: 768px) {
      header { padding: 16px 20px; flex-direction: column; gap: 16px; text-align: center; }
      .header-right { text-align: center; }
      nav { padding: 0 12px; overflow-x: auto; }
      .tab-btn { padding: 14px 14px; font-size: 11px; }
      main { padding: 20px 16px; }
      .cards-grid { grid-template-columns: 1fr; }
      .stats-bar { flex-wrap: wrap; gap: 16px; }
      .stat { border-right: none; padding-right: 0; margin-right: 0; }
      .logo-img { height: 56px; }
    }
  </style>
</head>
<body>

<header>
  <img src="tbct-logo.png" alt="The Bryan Coward Team" class="logo-img">
  <div class="header-right">
    <div class="header-title">Command Center</div>
    <div class="last-updated" id="lastUpdated">Loading...</div>
  </div>
</header>

<nav>
  <button class="tab-btn active" data-tab="transactions" onclick="switchTab(this)">
    Transactions <span class="tab-count" id="txCount">-</span>
  </button>
  <button class="tab-btn" data-tab="events" onclick="switchTab(this)">
    Upcoming Events <span class="tab-count" id="evCount">-</span>
  </button>
  <button class="tab-btn" data-tab="marketing" onclick="switchTab(this)">
    Marketing <span class="tab-count" id="mkCount">-</span>
  </button>
</nav>

<main>
  <!-- TRANSACTIONS -->
  <div id="pane-transactions" class="tab-pane active">
    <div class="stats-bar" id="txStats"></div>
    <div class="filter-bar">
      <span class="filter-label">Filter</span>
      <button class="filter-btn active" onclick="filterCards(this,'tx-card','all')">All</button>
      <button class="filter-btn" onclick="filterCards(this,'tx-card','listing')">Listings</button>
      <button class="filter-btn" onclick="filterCards(this,'tx-card','buyer')">Buyers</button>
      <button class="filter-btn" onclick="filterCards(this,'tx-card','active')">Active</button>
      <button class="filter-btn" onclick="filterCards(this,'tx-card','pending')">Pending</button>
      <button class="filter-btn" onclick="filterCards(this,'tx-card','closed')">Closed</button>
    </div>
    <div class="cards-grid" id="txCards"></div>
  </div>

  <!-- EVENTS -->
  <div id="pane-events" class="tab-pane">
    <div class="filter-bar">
      <span class="filter-label">Filter</span>
      <button class="filter-btn active" onclick="filterCards(this,'ev-card','all')">All</button>
      <button class="filter-btn" onclick="filterCards(this,'ev-card','thisweek')">This Week</button>
      <button class="filter-btn" onclick="filterCards(this,'ev-card','nextweek')">Next Week</button>
    </div>
    <div class="events-list" id="evList"></div>
  </div>

  <!-- MARKETING -->
  <div id="pane-marketing" class="tab-pane">
    <div class="filter-bar">
      <span class="filter-label">Filter</span>
      <button class="filter-btn active" onclick="filterCards(this,'mk-card','all')">All</button>
      <button class="filter-btn" onclick="filterCards(this,'mk-card','in-progress')">In Progress</button>
      <button class="filter-btn" onclick="filterCards(this,'mk-card','review')">Needs Review</button>
      <button class="filter-btn" onclick="filterCards(this,'mk-card','complete')">Completed</button>
    </div>
    <div id="mkList"></div>
  </div>
</main>

<script>
  // --- TAB SWITCHING ---
  function switchTab(btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('pane-' + btn.dataset.tab).classList.add('active');
  }

  // --- FILTER ---
  function filterCards(btn, cls, type) {
    btn.closest('.filter-bar').querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const now = new Date();
    const weekEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (7 - now.getDay()));
    const nextWeekEnd = new Date(weekEnd.getFullYear(), weekEnd.getMonth(), weekEnd.getDate() + 7);
    document.querySelectorAll('.' + cls).forEach(card => {
      let show = false;
      if (type === 'all') { show = true; }
      else if (cls === 'tx-card') {
        const t = (card.dataset.type || '').toLowerCase();
        const s = (card.dataset.status || '').toLowerCase();
        if (type === 'listing' && t === 'listing') show = true;
        else if (type === 'buyer' && t === 'buyer') show = true;
        else if (type === 'active' && s === 'active') show = true;
        else if (type === 'pending' && s.includes('pending')) show = true;
        else if (type === 'closed' && s === 'closed') show = true;
      } else if (cls === 'ev-card') {
        const d = new Date(card.dataset.date + 'T12:00:00');
        if (type === 'thisweek' && d <= weekEnd) show = true;
        else if (type === 'nextweek' && d > weekEnd && d <= nextWeekEnd) show = true;
      } else if (cls === 'mk-card') {
        if (card.dataset.status === type) show = true;
      }
      card.classList.toggle('hidden', !show);
    });
  }

  // --- TOGGLE EXPAND ---
  function toggle(el) { el.classList.toggle('expanded'); }

  // --- FORMAT ---
  function fmtPrice(n) { return n ? '$' + Number(n).toLocaleString() : 'N/A'; }
  function fmtDate(d) { if (!d) return null; return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function badgeCls(status) {
    const s = (status || '').toLowerCase();
    if (s === 'active') return 'badge-active';
    if (s.includes('pending')) return 'badge-pending';
    if (s === 'cancelled') return 'badge-cancelled';
    if (s === 'closed') return 'badge-closed';
    if (s.includes('construction')) return 'badge-new-construction';
    if (s.includes('exclusive')) return 'badge-office-exclusive';
    return 'badge-active';
  }

  // --- RENDER TRANSACTIONS ---
  function renderTx(txs) {
    document.getElementById('txCount').textContent = txs.length;
    const listings = txs.filter(t => t.type === 'Listing').length;
    const buyers = txs.filter(t => t.type === 'Buyer').length;
    const active = txs.filter(t => t.status === 'Active').length;
    const vol = txs.reduce((s, t) => s + (t.price || 0), 0);
    document.getElementById('txStats').innerHTML =
      stat(txs.length, 'Total') + stat(listings, 'Listings') +
      stat(buyers, 'Buyers') + stat(active, 'Active') +
      stat(fmtPrice(vol), 'Total Volume');
    document.getElementById('txCards').innerHTML = txs.map(t => `
      <div class="card tx-card" data-type="${t.type}" data-status="${t.status}" onclick="toggle(this)">
        <div class="card-header">
          <div><div class="card-address">${t.address}</div><div class="card-city">${t.city}</div></div>
          <div class="card-badges">
            <span class="badge badge-${t.type.toLowerCase()}">${t.type}</span>
            <span class="badge ${badgeCls(t.status)}">${t.status}</span>
          </div>
        </div>
        <div class="card-price">${fmtPrice(t.price)}</div>
        <div class="card-meta">${[t.details, t.clients ? 'Client: ' + t.clients : ''].filter(Boolean).join('<br>')}</div>
        <div class="expand-area">
          ${row('MLS', t.mls)}${row('Clients', t.clients)}${row('Phone', t.phone)}
          ${row('Email', t.email)}${row('Close Date', fmtDate(t.closeDate))}
          ${row('Listing Exp', fmtDate(t.expiry))}${row('Lender', t.lender)}
          ${row('Title', t.title)}
          ${t.trelloUrl ? `<a class="expand-link" href="${t.trelloUrl}" target="_blank">View in Trello &rarr;</a>` : ''}
        </div>
        <div class="chevron">&#9662;</div>
      </div>`).join('');
  }
  function stat(v, l) { return `<div class="stat"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`; }
  function row(lbl, val) { return val ? `<div class="expand-row"><span class="expand-lbl">${lbl}</span><span class="expand-val">${val}</span></div>` : ''; }

  // --- RENDER EVENTS ---
  function renderEv(evs) {
    document.getElementById('evCount').textContent = evs.length;
    document.getElementById('evList').innerHTML = evs.length ? evs.map(e => {
      const d = new Date(e.start + 'T12:00:00');
      return `<div class="ev-card ev-card" data-date="${e.start}">
        <div class="ev-date">
          <div class="ev-month">${d.toLocaleString('en-US',{month:'short'}).toUpperCase()}</div>
          <div class="ev-day">${d.getDate()}</div>
        </div>
        <div class="ev-info">
          <div class="ev-title">${e.title}</div>
          <div class="ev-time">${e.time}</div>
          ${e.location ? `<div class="ev-loc">&#128205; ${e.location}</div>` : ''}
        </div>
      </div>`;
    }).join('') : '<div class="empty">No upcoming events</div>';
  }

  // --- RENDER MARKETING ---
  function renderMk(mks) {
    document.getElementById('mkCount').textContent = mks.length;
    document.getElementById('mkList').innerHTML = mks.map(m => `
      <div class="mk-card mk-card" data-status="${m.status}" onclick="toggle(this)">
        <div class="mk-header">
          <div class="mk-title">${m.title}</div>
          <span class="badge badge-${m.status}">${m.statusLabel}</span>
        </div>
        <div class="mk-meta">${m.date} &middot; Requested by ${m.requestedBy}</div>
        ${m.notes ? `<div class="mk-notes">${m.notes}</div>` : ''}
      </div>`).join('');
  }

  // --- LOAD ---
  fetch('data.json?v=' + Date.now())
    .then(r => r.json())
    .then(d => {
      const ts = new Date(d.lastUpdated);
      document.getElementById('lastUpdated').textContent =
        'Updated ' + ts.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) +
        ' at ' + ts.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
      renderTx(d.transactions || []);
      renderEv(d.events || []);
      renderMk(d.marketingRequests || []);
    })
    .catch(() => { document.getElementById('lastUpdated').textContent = 'Could not load data'; });
</script>
</body>
</html>
